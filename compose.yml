# Kesef instance compose. Builds this repo's production Dockerfile.
# Upstream compose.example.yml pulls ghcr.io/we-promise/sure and is left unchanged.
# Secrets have no defaults. Run bin/setup-instance before the first up.

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-kesef}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Run bin/setup-instance.}
  POSTGRES_DB: ${POSTGRES_DB:-kesef_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required. Run bin/setup-instance.}
  SELF_HOSTED: "true"
  RAILS_ENV: production
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/1
  PRODUCT_NAME: ${PRODUCT_NAME:-כסף}
  ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
  BINDING: "0.0.0.0"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/d0raka/kesef:dev
    volumes:
      - app-storage:/rails/storage
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/up" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  worker:
    image: ghcr.io/d0raka/kesef:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  postgres-data:
  redis-data:
